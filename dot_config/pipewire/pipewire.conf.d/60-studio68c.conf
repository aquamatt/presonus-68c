# ABOUTME: Creates "Studio 68c Call Mic", a mono PipeWire source carrying only input 4
# ABOUTME: (AUX3) of the PreSonus Studio 68c, for call applications such as Signal.
#
# Requires the 68c's "Pro Audio" profile, which exposes the hardware channels as AUX0-AUX5
# in order: Mic/Inst/Line 1, Mic/Inst/Line 2, Mic/Line 3, Mic/Line 4, S/PDIF In L/R.
# Under any other profile the target node does not exist and the loopback attaches to some
# other source. To use a different input, change AUX3 below (AUX2 is input 3).
# Background and test results: ~/src/presonus/findings.md
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Studio 68c Call Mic"
      capture.props = {
        node.name = "capture.s68c_call_mic"
        audio.position = [ AUX3 ]
        stream.dont-remix = true
        target.object = "alsa_input.usb-PreSonus_Studio_68c_0132B680-00.pro-input-0"
        node.passive = true
      }
      playback.props = {
        node.name = "s68c_call_mic"
        media.class = "Audio/Source"
        audio.position = [ MONO ]
      }
    }
  }
]
